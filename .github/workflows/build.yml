name: Build Sintr

# Every push is compiled for iPhone and for Mac on GitHub's Macs, so a mistake shows up
# here (with the exact file and line) before anyone opens Xcode.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Build for ${{ matrix.platform }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Sintr.xcodeproj \
            -scheme Sintr \
            -configuration Debug \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Sintr/|BUILD (SUCCEEDED|FAILED)|Resolve Package" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Report package versions
        if: success() && matrix.platform == 'iOS'
        shell: bash
        run: |
          f=Sintr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$f" ]; then
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=Package.resolved::$msg"
          fi

      - name: Point at compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^/.*\.(swift|plist|xcassets|pbxproj).*: error: |^error: |: error: ' build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u > errors.txt || true
          # Package problems explain themselves on the lines after the error.
          grep -A12 "Could not resolve package dependencies" build.log | head -14 | sed 's/^/  /' >> errors.txt || true
          echo "$(wc -l < errors.txt) error line(s)"
          cat errors.txt | head -100
          # One annotation per error (GitHub shows up to 10 per step)...
          head -10 errors.txt | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g')
            echo "::error::$msg"
          done
          # ...and the full list in batches of 8, so every error can be read from the run's summary.
          split -l 8 errors.txt batch_ 2>/dev/null || true
          for f in $(ls batch_* 2>/dev/null | head -10); do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::warning title=Errors::$msg"
          done

      - name: Save the build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log

  audio:
    name: Mac audio helpers
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Check Sintr finds the processes that play an app's sound (Safari, Chrome, FaceTime)
        run: bash scripts/ci-audio-check.sh

  sectis:
    name: Sectis format
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Sintr reads and writes Sectis's sync format, and finds your action items
        run: bash scripts/ci-sectis-check.sh

  portable:
    name: Portable (Mac)
    # Running Sintr needs macOS 26 (building works on 15).
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Make the portable folder (like make-portable.sh on your Mac)
        shell: bash
        run: |
          set -o pipefail
          bash make-portable.sh "$RUNNER_TEMP" 2>&1 | tee build.log

      - name: Check it runs from a folder and keeps notes beside itself
        shell: bash
        run: |
          P="$RUNNER_TEMP/Sintr Portable"
          ls -la "$P" "$P/Sintr Data"
          lipo -archs "$P/Sintr.app/Contents/MacOS/Sintr"
          codesign --verify --deep --strict --verbose=2 "$P/Sintr.app"
          for KEY in NSMicrophoneUsageDescription NSAudioCaptureUsageDescription NSSpeechRecognitionUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$KEY" "$P/Sintr.app/Contents/Info.plist" >/dev/null || { echo "::error::Info.plist is missing $KEY"; exit 1; }
          done
          du -sh "$P/Sintr.app"
          bash scripts/ci-storage-check.sh "$P/Sintr.app" "Portable from a folder"
          OUT=$(cat "$RUNNER_TEMP/last-check.txt")
          grep -qxF "root=$P/Sintr Data" <<<"$OUT"
          grep -qx "portable=true" <<<"$OUT"
          grep -qx "note=true settings=true" <<<"$OUT"
          test -f "$P/Sintr Data/Settings.plist"

      - name: Check the same app without a Sintr Data folder uses normal storage
        if: always()
        shell: bash
        run: |
          bash scripts/ci-storage-check.sh "build/portable/Build/Products/Release/Sintr.app" "Normal storage"
          OUT=$(cat "$RUNNER_TEMP/last-check.txt")
          grep -qxF "root=$HOME/Library/Application Support/Sintr" <<<"$OUT"
          grep -qx "portable=false" <<<"$OUT"

      - name: Check the command line and the MCP server
        if: always()
        shell: bash
        run: bash scripts/ci-connect-check.sh "build/portable/Build/Products/Release/Sintr.app"

      - name: Try it on an exFAT "thumb drive" (disk image)
        if: always()
        shell: bash
        run: |
          hdiutil create -size 800m -fs ExFAT -volname SINTRTEST "$RUNNER_TEMP/thumb.dmg" >/dev/null
          hdiutil attach "$RUNNER_TEMP/thumb.dmg" >/dev/null
          bash make-portable.sh /Volumes/SINTRTEST 2>&1 | tail -3
          P="/Volumes/SINTRTEST/Sintr Portable"
          bash scripts/ci-storage-check.sh "$P/Sintr.app" "exFAT run 1" || true
          bash scripts/ci-storage-check.sh "$P/Sintr.app" "exFAT run 2" || true
          SIG=$(codesign --verify --deep --strict "$P/Sintr.app" 2>&1 && echo "signature OK")
          DOTS=$(find "$P" -name '._*' | wc -l | tr -d ' ')
          echo "::notice title=exFAT extras::codesign: ${SIG}%0A._ files: ${DOTS}"
          OUT=$(cat "$RUNNER_TEMP/last-check.txt")
          grep -qx "portable=true" <<<"$OUT"
          grep -qx "note=true settings=true" <<<"$OUT"

  screens:
    name: iPhone screenshots
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Build for the iPhone simulator and take screenshots
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-screenshots.sh
