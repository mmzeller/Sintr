name: Build Sintr

# Every push is compiled for iPhone and for Mac on GitHub's Macs, so a mistake shows up
# here (with the exact file and line) before anyone opens Xcode.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Build for ${{ matrix.platform }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Sintr.xcodeproj \
            -scheme Sintr \
            -configuration Debug \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Sintr/|BUILD (SUCCEEDED|FAILED)|Resolve Package" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Point at compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^/.*\.(swift|plist|xcassets|pbxproj).*: error: |^error: |: error: ' build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u > errors.txt || true
          # Package problems explain themselves on the lines after the error.
          grep -A12 "Could not resolve package dependencies" build.log | head -14 | sed 's/^/  /' >> errors.txt || true
          echo "$(wc -l < errors.txt) error line(s)"
          cat errors.txt | head -100
          # One annotation per error (GitHub shows up to 10 per step)...
          head -10 errors.txt | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g')
            echo "::error::$msg"
          done
          # ...and the full list in batches of 8, so every error can be read from the run's summary.
          split -l 8 errors.txt batch_ 2>/dev/null || true
          for f in $(ls batch_* 2>/dev/null | head -10); do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::warning title=Errors::$msg"
          done

      - name: Save the build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
